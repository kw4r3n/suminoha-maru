<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
 <!-- Only an explicit Ratio35 family request gains these disjoint Han companions. -->
 <match target="pattern">
  <test name="family" qual="any" compare="eq"><string>Morimo Code JP95 Terminal Addons Ratio35</string></test>
  <edit name="family" mode="append" binding="strong">
   <string>Morimo Ratio35 Han JP</string>
   <string>Morimo Ratio35 Han RareA</string>
   <string>Morimo Ratio35 Han RareB</string>
  </edit>
 </match>
</fontconfig>
